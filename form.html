<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML Forms demonstration</h1>
    <h2>1. Contact Form</h2>
    <fieldset>
        <legend>Persnoal Information</legend>
        <form>
            <label for="na">Full Name:</label>
            <input type="text" placeholder="Jhon Doe" name="Name" id="na" required>
            <br><br>
            <label for="em">Email Address:</label>
            <input type="text" placeholder="example@gmail.com" name="Email" id="em" required><br><br>
            <label for="no">Phone Number:</label>
            <input type="number" placeholder="1234567890" name="Number" id="no" required><br><br>
            <label for="ms">Your Message</label><br>
            <textarea name="feedback" id="ms"></textarea>
            <br><br>
            <label for="chk">Subscribe to our newsletter</label>
            <input type="checkbox" id="chk" required>
            <br>
        </form>
        <button>Submit</button>
        <button>Clear Form</button>
    </fieldset>
</body>
</html>
